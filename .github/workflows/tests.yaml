name: Behavioural tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check cleanup failure handling without Docker
        run: python3 scripts/test-container-cleanup.py
      - name: Run pinned Home Assistant tests and clean up
        run: sh scripts/test-container.sh
